name: publish release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Strict plugin.json version to publish (for example 0.7.0)
        required: true
        type: string
      release_kind:
        description: Publish as a GitHub pre-release or stable release
        required: true
        default: prerelease
        type: choice
        options: [prerelease, stable]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: failovarr-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release identity
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-GhJson([string[]]$Arguments) {
            $raw = & gh api @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: gh api $($Arguments -join ' ')" }
            return (($raw -join "`n") | ConvertFrom-Json)
          }
          $manifest = Get-Content -Raw failovarr/plugin.json | ConvertFrom-Json
          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "plugin.json version $($manifest.version) does not match requested $env:EXPECTED_VERSION"
          }
          if ($manifest.version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Plugin version must use strict semantic versioning"
          }
          $tag = "v$($manifest.version)"
          $releaseTitle = "Failovarr $($manifest.version)"
          $matchingRefs = @(Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag"))
          $exactTag = @($matchingRefs | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($exactTag.Count -gt 1) { throw "More than one Git tag matches $tag" }
          $releases = @(Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases?per_page=100"))
          $taggedReleases = @($releases | Where-Object { $_.tag_name -eq $tag })
          if ($exactTag.Count -eq 1) {
            if ($env:RELEASE_KIND -ne "stable") {
              throw "Tag $tag already exists; only stable promotion may reuse a published pre-release tag"
            }
            if ($taggedReleases.Count -ne 1) { throw "Expected exactly one release for existing tag $tag" }
            $release = $taggedReleases[0]
            if ($release.draft -or -not $release.prerelease -or $release.name -ne $releaseTitle) {
              throw "Existing $tag release is not the expected published pre-release"
            }
            $ref = Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag")
            if ($ref.object.type -ne "commit" -or $ref.object.sha -ne $env:GITHUB_SHA) {
              throw "Existing tag $tag does not point to this qualified main commit"
            }
            if ($release.target_commitish -ne $env:GITHUB_SHA) {
              throw "Existing release $tag does not target this qualified main commit"
            }
            "RELEASE_OPERATION=promote" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "RELEASE_ID=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } elseif ($taggedReleases.Count -gt 0) {
            throw "A release exists for missing tag $tag"
          } else {
            "RELEASE_OPERATION=publish" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          "VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Require successful full qualification for this tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/verify_release_qualification.py \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
      - name: Build and validate Failovarr plugin ZIP
        if: env.RELEASE_OPERATION == 'publish'
        shell: pwsh
        run: pwsh -NoProfile -File tools/build_release.ps1 -Version $env:VERSION
      - name: Resolve unpublished GitHub release
        if: env.RELEASE_OPERATION == 'publish'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-GhJson([string[]]$Arguments) {
            $raw = & gh api @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: gh api $($Arguments -join ' ')" }
            return (($raw -join "`n") | ConvertFrom-Json)
          }
          $releaseTitle = "Failovarr $env:VERSION"
          $releases = @(Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases?per_page=100"))
          $matches = @($releases | Where-Object {
            $_.tag_name -eq $env:TAG -or
            ($_.draft -and $_.name -eq $releaseTitle -and $_.tag_name -like "untagged-*")
          })
          if ($matches.Count -gt 1) { throw "More than one draft release matches $releaseTitle" }
          if ($matches.Count -eq 1) {
            $release = $matches[0]
            if (-not $release.draft) { throw "Release $env:TAG already exists and is published" }
            $payload = @{ target_commitish = $env:GITHUB_SHA } | ConvertTo-Json -Compress
            $raw = $payload | & gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --input -
            if ($LASTEXITCODE -ne 0) { throw "Could not retarget draft release $env:TAG" }
            $release = (($raw -join "`n") | ConvertFrom-Json)
          } else {
            $payload = @{
              tag_name = $env:TAG
              target_commitish = $env:GITHUB_SHA
              name = "Failovarr $env:VERSION"
              generate_release_notes = $true
              draft = $true
              prerelease = $false
            } | ConvertTo-Json -Compress
            $raw = $payload | & gh api --method POST "repos/$env:GITHUB_REPOSITORY/releases" --input -
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $env:TAG" }
            $release = (($raw -join "`n") | ConvertFrom-Json)
          }
          if (
            -not $release.draft -or
            $release.name -ne $releaseTitle -or
            ($release.tag_name -ne $env:TAG -and $release.tag_name -notlike "untagged-*")
          ) { throw "Release draft identity is invalid" }
          "RELEASE_ID=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Upload and verify release assets
        if: env.RELEASE_OPERATION == 'publish'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-GhJson([string[]]$Arguments) {
            $raw = & gh api @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: gh api $($Arguments -join ' ')" }
            return (($raw -join "`n") | ConvertFrom-Json)
          }
          function Remove-ReleaseAsset([long]$AssetId, [string]$Name) {
            & gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$AssetId"
            if ($LASTEXITCODE -ne 0) { throw "Could not remove release asset: $Name" }
          }
          function Rename-ReleaseAsset([long]$AssetId, [string]$Name) {
            $payload = @{ name = $Name } | ConvertTo-Json -Compress
            $raw = $payload | & gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/assets/$AssetId" --input -
            if ($LASTEXITCODE -ne 0) { throw "Could not finalize release asset: $Name" }
            return (($raw -join "`n") | ConvertFrom-Json)
          }
          $release = Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID")
          if (-not $release.draft) { throw "Release must stay unpublished until assets are verified" }
          $uploadBase = $release.upload_url -replace '\{\?name,label\}$', ''
          if ($uploadBase -notlike 'https://uploads.github.com/*') { throw "Release upload URL is invalid" }
          $uploadHeaders = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $assets = @(
            @{ Path = "dist/failovarr-$env:VERSION.zip"; ContentType = "application/zip" },
            @{ Path = "dist/failovarr-$env:VERSION.zip.sha256"; ContentType = "text/plain" }
          )
          foreach ($asset in $assets) {
            $name = [IO.Path]::GetFileName($asset.Path)
            $digest = "sha256:" + (Get-FileHash -Algorithm SHA256 $asset.Path).Hash.ToLowerInvariant()
            $existing = @($release.assets | Where-Object { $_.name -eq $name })
            if ($existing.Count -gt 1) { throw "Duplicate draft asset: $name" }
            if ($existing.Count -eq 1 -and $existing[0].digest -eq $digest) {
              continue
            }
            $stagedName = "$name.upload-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            $uploadUri = "${uploadBase}?name=$([uri]::EscapeDataString($stagedName))"
            try {
              $uploaded = Invoke-RestMethod -Method Post -Uri $uploadUri -Headers $uploadHeaders -ContentType $asset.ContentType -InFile $asset.Path
            } catch {
              throw "Could not upload staged release asset: $name ($($_.Exception.Message))"
            }
            $staged = Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases/assets/$($uploaded.id)")
            if ($staged.name -ne $stagedName -or $staged.digest -ne $digest) {
              Remove-ReleaseAsset $staged.id $stagedName
              throw "Staged release asset failed digest verification: $name"
            }
            if ($existing.Count -eq 1) {
              Remove-ReleaseAsset $existing[0].id $name
            }
            $finalized = Rename-ReleaseAsset $staged.id $name
            if ($finalized.name -ne $name -or $finalized.digest -ne $digest) {
              throw "Finalized release asset failed verification: $name"
            }
          }
          $release = Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID")
          foreach ($asset in $assets) {
            $name = [IO.Path]::GetFileName($asset.Path)
            $digest = "sha256:" + (Get-FileHash -Algorithm SHA256 $asset.Path).Hash.ToLowerInvariant()
            $verified = @($release.assets | Where-Object { $_.name -eq $name -and $_.digest -eq $digest })
            if ($verified.Count -ne 1) { throw "Verified release asset is missing or changed: $name" }
          }
          $stagedAssets = @($release.assets | Where-Object { $_.name -like '*.upload-*' })
          foreach ($staged in $stagedAssets) {
            Remove-ReleaseAsset $staged.id $staged.name
          }
      - name: Verify published pre-release assets for promotion
        if: env.RELEASE_OPERATION == 'promote'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Invoke-GhJson([string[]]$Arguments) {
            $raw = & gh api @Arguments
            if ($LASTEXITCODE -ne 0) { throw "GitHub API request failed: gh api $($Arguments -join ' ')" }
            return (($raw -join "`n") | ConvertFrom-Json)
          }
          $release = Invoke-GhJson @("repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID")
          if ($release.draft -or -not $release.prerelease -or $release.tag_name -ne $env:TAG) {
            throw "Promotion source is not the expected published pre-release"
          }
          $zipName = "failovarr-$env:VERSION.zip"
          $checksumName = "$zipName.sha256"
          $expectedNames = @($zipName, $checksumName)
          if ($release.assets.Count -ne $expectedNames.Count) {
            throw "Promotion source must contain exactly the ZIP and checksum assets"
          }
          if (@($release.assets | Where-Object { $_.name -like "*.upload-*" }).Count -gt 0) {
            throw "Promotion source contains temporary upload assets"
          }
          foreach ($name in $expectedNames) {
            if (@($release.assets | Where-Object { $_.name -eq $name }).Count -ne 1) {
              throw "Promotion source is missing or duplicates asset $name"
            }
          }
          $zip = @($release.assets | Where-Object { $_.name -eq $zipName })[0]
          $checksum = @($release.assets | Where-Object { $_.name -eq $checksumName })[0]
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName
          $checksumPath = Join-Path $env:RUNNER_TEMP $checksumName
          Invoke-WebRequest -Uri $zip.browser_download_url -OutFile $zipPath
          Invoke-WebRequest -Uri $checksum.browser_download_url -OutFile $checksumPath
          $actualZipHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant()
          $actualChecksumHash = (Get-FileHash -Algorithm SHA256 $checksumPath).Hash.ToLowerInvariant()
          $checksumText = (Get-Content -Raw $checksumPath).Trim()
          $checksumPattern = "^([a-f0-9]{64})  " + [regex]::Escape($zipName) + "$"
          if ($checksumText -notmatch $checksumPattern) {
            throw "Published checksum has an invalid format"
          }
          if ($Matches[1] -ne $actualZipHash) {
            throw "Published ZIP checksum does not match the checksum asset"
          }
          if ($zip.digest -ne "sha256:$actualZipHash" -or $checksum.digest -ne "sha256:$actualChecksumHash") {
            throw "Published asset digest does not match downloaded content"
          }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          if ($env:RELEASE_OPERATION -eq "promote") {
            $payload = @{ prerelease = $false } | ConvertTo-Json -Compress
            $raw = $payload | & gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --input -
            if ($LASTEXITCODE -ne 0) { throw "Could not promote pre-release $env:TAG" }
            $release = (($raw -join "`n") | ConvertFrom-Json)
            if ($release.draft -or $release.prerelease -or $release.tag_name -ne $env:TAG) {
              throw "Promoted release state is invalid"
            }
            $ref = (& gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:TAG" | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or $ref.object.type -ne "commit" -or $ref.object.sha -ne $env:GITHUB_SHA) {
              throw "Promoted Git tag $env:TAG is missing or points to another commit"
            }
            Write-Host "FAILOVARR_RELEASE_URL=$($release.html_url)"
            exit 0
          }
          if ($env:RELEASE_OPERATION -ne "publish") { throw "Unknown release operation" }
          $payload = @{
            tag_name = $env:TAG
            target_commitish = $env:GITHUB_SHA
            draft = $false
            prerelease = ($env:RELEASE_KIND -eq 'prerelease')
          } | ConvertTo-Json -Compress
          $raw = $payload | & gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --input -
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $env:TAG" }
          $release = (($raw -join "`n") | ConvertFrom-Json)
          $expectedPrerelease = $env:RELEASE_KIND -eq 'prerelease'
          if ($release.draft -or $release.prerelease -ne $expectedPrerelease -or $release.tag_name -ne $env:TAG) {
            throw "Published release state is invalid"
          }
          $matchingRefs = @(& gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$env:TAG" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or @($matchingRefs | Where-Object { $_.ref -eq "refs/tags/$env:TAG" }).Count -ne 1) {
            throw "Published Git tag $env:TAG is missing"
          }
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/failovarr-$env:VERSION.zip"
          $downloaded = Join-Path $env:RUNNER_TEMP "failovarr-$env:VERSION.zip"
          Invoke-WebRequest -Uri $download -OutFile $downloaded
          $expected = (Get-FileHash -Algorithm SHA256 "dist/failovarr-$env:VERSION.zip").Hash
          $actual = (Get-FileHash -Algorithm SHA256 $downloaded).Hash
          if ($actual -ne $expected) { throw "Published ZIP checksum does not match the built ZIP" }
          Write-Host "FAILOVARR_RELEASE_URL=$($release.html_url)"
