name: publish release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Strict plugin.json version to publish (for example 0.7.0)
        required: true
        type: string
      release_kind:
        description: Publish as a GitHub pre-release or stable release
        required: true
        default: prerelease
        type: choice
        options: [prerelease, stable]

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release identity
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw failovarr/plugin.json | ConvertFrom-Json
          if ($manifest.version -ne $env:EXPECTED_VERSION) {
            throw "plugin.json version $($manifest.version) does not match requested $env:EXPECTED_VERSION"
          }
          if ($manifest.version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Plugin version must use strict semantic versioning"
          }
          $tag = "v$($manifest.version)"
          $matchingRefs = @(gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check whether tag $tag exists"
          }
          $exactTag = @($matchingRefs | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($exactTag.Count -gt 0) {
            throw "Tag $tag already exists"
          }
          "VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Require successful full qualification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow qualification --commit "$GITHUB_SHA" --status completed --json conclusion,databaseId,event --jq '.[] | select(.conclusion == "success" and .event == "workflow_dispatch") | .databaseId' | head -n 1)"
          test -n "$run" || { echo "A successful full qualification workflow is required for this exact commit." >&2; exit 1; }
          echo "FAILOVARR_CI_QUALIFICATION_RUN=$run"
      - name: Build and validate Failovarr plugin ZIP
        shell: pwsh
        run: pwsh -NoProfile -File tools/build_release.ps1 -Version $env:VERSION
      - name: Create unpublished GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "Release $TAG already exists" >&2
            exit 1
          }
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Failovarr $VERSION" \
            --generate-notes \
            --draft
      - name: Upload and verify release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "dist/failovarr-$env:VERSION.zip"
          $checksum = "$zip.sha256"
          gh release upload $env:TAG $zip $checksum --repo $env:GITHUB_REPOSITORY
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets,isDraft | ConvertFrom-Json
          if (-not $release.isDraft) { throw "Release must stay unpublished until assets are verified" }
          $expected = @("failovarr-$env:VERSION.zip", "failovarr-$env:VERSION.zip.sha256")
          $actual = @($release.assets | ForEach-Object name)
          foreach ($name in $expected) {
            if ($actual -notcontains $name) { throw "Release asset is missing: $name" }
          }
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:TAG" | ConvertFrom-Json
          $payload = @{ draft = $false; prerelease = ($env:RELEASE_KIND -eq 'prerelease') } | ConvertTo-Json -Compress
          $payload | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --input - | Out-Null
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,assets
