name: synchronize wiki

on:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Synchronize canonical English pages
        env:
          WIKI_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wiki_dir="$RUNNER_TEMP/wiki"
          auth="$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 -w 0)"
          if ! git -c http.extraheader="AUTHORIZATION: basic $auth" clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$wiki_dir"; then
            echo "The GitHub Wiki must be initialized once with a Home page before synchronization." >&2
            exit 1
          fi
          managed=(Home Features Getting-Started Settings-Walkthrough Deployment-Modes Storage-Backends First-Sync-and-Initialization Operations-and-Planned-Handoff Troubleshooting Security-and-Limitations _Sidebar)
          for page in "${managed[@]}"; do rm -f "$wiki_dir/$page.md"; done
          cp docs/wiki/*.md "$wiki_dir/"
          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            exit 0
          fi
          git add --all
          git commit -m "docs: synchronize plugin wiki"
          git push origin HEAD
